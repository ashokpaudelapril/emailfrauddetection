<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spam Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Email Spam Detector</h1>
        <form method="POST">
            <textarea name="email_text" rows="10" placeholder="Paste your email here..."></textarea><br><br>
            <input type="submit" value="Check">
        </form>
        {% if prediction %}
            <div class="result">
                Result: {{ prediction }}
            </div>
        {% endif %}
    </div>
</body>
</html>
